name: Bug Report
description: Report a bug, crash, or unexpected behavior in OpenPet
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure sensitive tokens, paths, or keys are not included in this report.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. Launch openpet-host
        2. Drag pet to bottom-right corner
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows & Hardware Environment
      description: Windows 11 build, monitor configuration, scaling percentage (e.g. 150%).
    validations:
      required: true
